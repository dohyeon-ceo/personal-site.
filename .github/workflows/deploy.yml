# 개인 사이트 모음을 GitHub Pages에 배포한다.
#   https://<아이디>.github.io/personal-site/                  ← 사이트 목록 (index.html)
#   https://<아이디>.github.io/personal-site/stock-dashboard/  ← 미국 주식 분야별 비교
# - 코드를 main에 푸시하면: 저장된 데이터로 바로 배포 (약 1분)
# - 평일 매일 아침(예약 실행)·수동 실행: 주식 데이터를 새로 받아 저장소에 커밋하고 배포
name: 사이트 배포

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 평일 22:17 UTC (한국 시간 다음날 07:17)
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write   # 새 데이터를 저장소에 커밋하기 위해
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주식 데이터 수집 (SEC · Yahoo · Wikipedia)
        if: github.event_name != 'push'
        env:
          # SEC는 연락처가 들어간 User-Agent를 권장한다. 저장소 Settings > Variables 에 등록 가능.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'PersonalStockDashboard contact@example.com' }}
        run: python3 stock-dashboard/scripts/fetch_data.py --out stock-dashboard/site/data.json
      - name: 새 데이터를 저장소에 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-dashboard/site/data.json
          if git diff --cached --quiet; then echo "데이터 변화 없음"; exit 0; fi
          git commit -m "주식 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
          # 그 사이 다른 커밋이 올라왔으면 그 위에 얹어서 푸시
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: 배포 폴더 구성
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r stock-dashboard/site _site/stock-dashboard
          cp -r youtube-script _site/youtube-script
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
