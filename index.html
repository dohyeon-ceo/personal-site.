<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 사이트 모음</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f2; --card: #fcfcfb; --border: #e3e2de; --text: #0b0b0b; --sub: #85847f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111110; --card: #1a1a19; --border: #31312e; --text: #f0efec; --sub: #8d8c85; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  a.card { display: flex; gap: 12px; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; color: inherit; text-decoration: none; margin-bottom: 10px; }
  a.card .ic { font-size: 28px; }
  a.card b { display: block; font-size: 16px; }
  a.card span { color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>내 사이트 모음</h1>
  <a class="card" href="stock-dashboard/">
    <div class="ic">📈</div>
    <div><b>FIT — Find Top</b><span>미국 S&amp;P 500 기업의 PER·성장률을 분야별로 비교해 내 기준에 딱 맞는 기업 찾기</span></div>
  </a>
</main>
</body>
</html>
